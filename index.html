<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="header.css">
  <link rel="stylesheet" href="sider.css">
  <link rel="stylesheet" href="general.css">
  <link rel="stylesheet" href="content.css">
  <title>Youtube</title>
</head>
<body>
  <header class="header">
    <section class="right-section">
      <img class="hamburger" src="hamburger-menu.svg">
      <a href="youtube.html">
      <img class="header-logo" src="youtube-logo.svg">
      </a>
    </section>
    <section class="middle-section">
      <input class="search-bar" type="text" placeholder="search">
      <button class="search-button">
        <img class="search-button-logo" src="search.svg">
        <div class="tooltip">Search</div>
      </button>
      <button class="voice-search-button">
      <img class="voice-search-logo" src="voice-search-icon.svg">
      <div class="tooltip">Search with your voice</div>
      </button>
    </section>
    <section class="right-section">
      <div class="tooltip-container">
        <div class="apps-button">
      <img class="icon" src="upload.svg">
      <div class="tooltip">Create</div>
    </div>
    </div>
    <div class="tooltip-container">
      <div class="apps-button">
      <img class="icon" src="youtube-apps.svg">
      <div class="tooltip">Youtube apps</div>
    </div>
    </div>
    <div class="tooltip-container">
      <div class="apps-button">
      <img class="icon" src="notifications.svg">
      <div class="notification-count">7</div>
      <div class="tooltip">Notifications</div>
      </div>
    </div>
      <img class="my-channel" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTkof7u-ZZQoCjzqcK0UecB_ARpY5I6zD12nABzgCF74jOVTivZLW9fR-2eznM&s">
    </section>
  </header>
  
  <aside class="sider">
    <section>
      <div class="sidebar-link">
        <img src="home.svg">
        <div>Home</div>
      </div>
      <div class="sidebar-link">
        <img src="explore.svg">
        <div>Explore</div>
      </div><div class="sidebar-link">
        <img src="subscriptions.svg">
        <div>Subscriptions</div>
      </div><div class="sidebar-link">
        <img src="originals.svg">
        <div>Originals</div>
      </div><div class="sidebar-link">
        <img src="youtube-music.svg">
        <div>Youtube Music</div>
      </div>
      <div class="sidebar-link">
        <img src="library.svg">
        <div>Library</div>
      </div>
    </section>
  </aside>

  <main>
    <section class="container js-container">
    </section>
  </main>
      <script type="module" src="youtube.js"></script>
</body>
</html>
